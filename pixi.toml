[workspace]
authors = ["Jonas Freimuth <jonas.freimuth@tron-mainz.de>", "Johannes Hausmann <johannes.hausmann@tron-mainz.de>", "Luis Kress <luis.kress@tron-mainz.de>"]
channels = ["conda-forge", "bioconda"]
description = "Reproducible generation of references and resources for next generation sequencing pipelines."
name = "tronmake-genome-lib-builder"
platforms = ["linux-64"]
version = "0.0.3"

[dependencies]
openssl = { version = "<=3.4.2", channel = "conda-forge" }
eido = { channel = "conda-forge" }
peppy = { channel = "conda-forge" }
snakemake-minimal = { version = "9.13.7.*", channel = "bioconda" }
snakemake-storage-plugin-http = { channel = "bioconda" }
snakemake-executor-plugin-cluster-generic = { channel = "bioconda" }

[feature.docs.dependencies]
mkdocs = { channel = "conda-forge" }
mkdocs-material = { channel = "conda-forge" }
mkdocs-table-reader-plugin = { channel = "conda-forge" }

[feature.docs.tasks]
documentation = "mkdocs build -f docs/tronmake-genome-lib-builder/mkdocs.yml"

[feature.test.dependencies]
pytest-workflow = { channel = "conda-forge" }

[feature.test.tasks]
unittest = "pytest --tag unittest"

[environments]
docs = { features = ["docs"], no-default-feature = true }
test = { features = ["test"] }
