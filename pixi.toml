[workspace]
authors = [
  "Jonas Freimuth <jonas.freimuth@tron-mainz.de>",
  "Johannes Hausmann <johannes.hausmann@tron-mainz.de>",
  "Luis Kress <luis.kress@tron-mainz.de>"
]
channels = ["conda-forge", "bioconda"]
description = "Reproducible generation of references and resources for next generation sequencing pipelines."
name = "tronmake-genome-lib-builder"
platforms = ["linux-64"]
version = "0.0.3"  # x-release-please-version

[dependencies]
# Ensure compatibility with requests. Else there may be errors along the lines
# of UNEXPECTED_EOF_WHILE_READING from SSL.
openssl = { version = "<=3.4.2", channel = "conda-forge" }
eido = { channel = "conda-forge" }
peppy = { channel = "conda-forge" }
snakemake-minimal = { version = ">=9.20,<10", channel = "bioconda" }
snakemake-storage-plugin-http = { channel = "bioconda" }
snakemake-executor-plugin-cluster-generic = { channel = "bioconda" }

[feature.docs.dependencies]
mkdocs = { version = "<2", channel = "conda-forge" }
mkdocs-material = { channel = "conda-forge" }
mkdocs-table-reader-plugin = { channel = "conda-forge" }

[feature.docs.tasks]
documentation = { cmd = "mkdocs build -f docs/tronmake-genome-lib-builder/mkdocs.yml", default-environment = "docs" }

[feature.test.dependencies]
pytest-workflow = { channel = "conda-forge" }

[feature.test.tasks]
unittest = { cmd = "pytest --tag unittest", default-environment = "test" }

[feature.style-md.dependencies]
mdformat = ">=0.7.22,<0.8"
mdformat-gfm = ">=1.0.0,<2"
mdformat-shfmt = ">=0.2.0,<0.3"
mdformat-tables = ">=1.0.0,<2"

[feature.style-md.tasks]
style-md = { cmd = "mdformat **/*.md .github/**/*.md", default-environment = "style-md" }
lint-md = { cmd = "mdformat --check **/*.md .github/**/*.md", default-environment = "style-md" }

[feature.style-python.dependencies]
black = ">=26.3.1,<27"

[feature.style-python.tasks]
style-python = { cmd = "black **/*.py", default-environment = "style-python" }
lint-python = { cmd = "black --check **/*.py", default-environment = "style-python" }

[feature.style-r.dependencies]
r-base = ">=4.5.3,<4.6"
r-styler = ">=1.11.0,<2"

[feature.style-r.tasks]
style-r = { cmd = """\
    R -q --vanilla -e "styler::style_dir('workflow')"\
    """, default-environment = "style-r" }
lint-r = { cmd = """\
    R -q --vanilla -e "styler::style_dir('workflow', dry = 'fail')"\
    """, default-environment = "style-r" }

[feature.style-sh.dependencies]
go-shfmt = ">=3.13.1,<4"

[feature.style-sh.tasks]
style-sh = { cmd = "shfmt --write --indent 4 **/*.sh", default-environment = "style-sh" }
lint-sh = { cmd = "shfmt --diff --indent 4 **/*.sh", default-environment = "style-sh" }

[feature.style-snakemake.dependencies]
snakefmt = ">=1.1.0,<2"

[feature.style-snakemake.tasks]
style-snakemake = { cmd = "snakefmt workflow/", default-environment = "style-snakemake" }
lint-snakemake = { cmd = "snakefmt --check workflow/", default-environment = "style-snakemake" }

[feature.style-toml.dependencies]
tombi = ">=0.10.5,<0.11"

[feature.style-toml.tasks]
style-toml = { cmd = "tombi format **/*.toml", default-environment = "style-toml" }
lint-toml = { cmd = "tombi format --check **/*.toml", default-environment = "style-toml" }

[feature.style-yaml.dependencies]
yamlfmt = ">=0.21.0,<0.22"

[feature.style-yaml.tasks]
style-yaml = { cmd = "yamlfmt **/*.yaml **/*.yml .github/**/*.yaml .github/**/*.yml", default-environment = "style-yaml" }
lint-yaml = { cmd = "yamlfmt -lint **/*.yaml **/*.yml .github/**/*.yaml .github/**/*.yml", default-environment = "style-yaml" }

[feature.rule-env-pinning.dependencies]
snakedeploy = ">=0.16.0,<0.17"

[feature.rule-env-pinning.tasks]
pin-rule-envs = { cmd = "snakedeploy pin-conda-envs workflow/envs/*.yaml", default-environment = "rule-env-pinning" }

[environments]
docs = { features = ["docs"], no-default-feature = true }
test = { features = ["test"] }
style-md = { features = ["style-md"], no-default-feature = true }
style-python = { features = ["style-python"], no-default-feature = true }
style-r = { features = ["style-r"], no-default-feature = true }
style-sh = { features = ["style-sh"], no-default-feature = true }
style-snakemake = { features = ["style-snakemake"], no-default-feature = true }
style-toml = { features = ["style-toml"], no-default-feature = true }
style-yaml = { features = ["style-yaml"], no-default-feature = true }
rule-env-pinning = { features = ["rule-env-pinning"], no-default-feature = true }

[tasks]
lint-workflow = """\
    snakemake \
        -s workflow/Snakefile \
        --software-deployment-method conda \
        --lint\
    """
# Order matters, these are laid out from most likely to fail during development
# to least likely.
style = { depends-on = [
  "style-snakemake",
  "style-python",
  "style-r",
  "style-md",
  "style-sh",
  "style-yaml",
  "style-toml"
] }
lint = { depends-on = [
  "lint-workflow",
  "lint-snakemake",
  "lint-python",
  "lint-r",
  "lint-md",
  "lint-sh",
  "lint-yaml",
  "lint-toml"
] }
